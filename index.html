<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The K.I.S.S. Automata</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; background:#0f0b12; color:#f5f2f8; }
    .page { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
    h1 { font-size: clamp(2rem, 7vw, 4rem); margin-bottom: 12px; text-align:center; }
    .subtitle { opacity:0.85; margin-bottom: 28px; text-align:center; }
    button, select { background:#29183b; color:white; border:1px solid #5a3f7f; border-radius:10px; padding:10px 14px; font-size:1rem; }
    button:hover { filter:brightness(1.1); cursor:pointer; }
    .hidden { display:none !important; }
    #sim-page { justify-content:flex-start; gap:16px; }
    .top-row, .controls { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
    .canvas-wrap { width:min(90vw, 700px); aspect-ratio:1/1; background:black; border:2px solid #5a3f7f; border-radius:12px; display:grid; place-items:center; overflow:hidden; }
    #frame { width:100%; height:100%; object-fit:contain; image-rendering:auto; }
    .info { font-size:0.95rem; opacity:0.9; text-align:center; }
  </style>
</head>
<body>
  <section id="home-page" class="page">
    <h1>The K.I.S.S.</h1>
    <p class="subtitle">Neural Cellular Automata recreation of <em>The Kiss</em>.</p>
    <button id="start-btn">Start "The K.I.S.S." Automata</button>
  </section>

  <section id="sim-page" class="page hidden">
    <h1 style="font-size:2rem; margin:0;">The K.I.S.S. Automata</h1>
    <div class="top-row">
      <label>
        Model:
        <select id="model-select">
          <option value="weak">Weak model</option>
          <option value="good">Good model</option>
        </select>
      </label>
      <button id="zoom-btn">Zoom</button>
    </div>

    <div class="canvas-wrap">
      <img id="frame" alt="NCA simulation frame" />
    </div>

    <div class="controls">
      <button id="play-btn">Play</button>
      <button id="pause-btn">Pause</button>
      <button id="restart-btn">Restart</button>
      <label>
        Speed:
        <select id="speed-select">
          <option value="1">1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
        </select>
      </label>
    </div>

    <p id="model-info" class="info"></p>
  </section>

  <script src="app.js"></script>
</body>
</html>
