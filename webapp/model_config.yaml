model_name: kiss_nca
resolution: 64
neighborhood_size: 3
state_channels: 16
hidden_channels: 16
condition_dim: 16
update_rate: 0.5

dataset_dir: paintings/64
paintings:
  - the_kiss
  - adele_bloch_bauer
  - tree_of_life
  - judith
  - danae

training:
  iterations: 5000
  batch_size: 8
  steps_min: 48
  steps_max: 96
  learning_rate: 0.001
  lambda_persist: 0.5
  lambda_transition: 0.25
  use_growth: true
  use_persistence: true
  use_transition: true

device: auto

output:
  model_path: webapp/saved_model/kiss_nca.pt
  metadata_path: webapp/saved_model/metadata.json
